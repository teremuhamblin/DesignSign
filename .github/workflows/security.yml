name: Security Scan

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 3 * * 1" # Tous les lundis à 03:00

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          ignore-unfixed: true
          severity: HIGH,CRITICAL
